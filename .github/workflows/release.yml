name: Release

on:
  push:
    tags: ['v*']

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo version and changelog exists
        run: |
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          test "v$cargo_version" = "${GITHUB_REF_NAME}"
          test -f "Changelogs/${GITHUB_REF_NAME}.md" || { echo "::error::No changelog at Changelogs/${GITHUB_REF_NAME}.md - add it before tagging"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "Changelogs/${GITHUB_REF_NAME}.md"

  aur:
    # Disabled until an AUR account and the first manual package push exist (AUR registration closed).
    if: false
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set pkgver from tag
        run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: nzxt-cam-linux
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: winepicfin
          commit_email: finleyaubin@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
          updpkgsums: true
          test: true

  bundles:
    needs: github-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - name: Build deb, rpm and AppImage
        run: npm run tauri build -- --bundles deb,rpm,appimage --config '{"bundle":{"active":true}}'
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage
